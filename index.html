<script>
var KEY="shape-verao-v1",S={uid:"",email:"",quiz:null,done:{},view:"",start:"",w:[],gw:0,wa:{},tab:"cal"};
var CFG=window.APP_CONFIG||{},sb=null,SYNC="",stimer=null,LS={step:"email",email:"",msg:""};
try{sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey)}catch(e){}
function payload(){return{quiz:S.quiz,done:S.done,start:S.start,w:S.w,gw:S.gw,wa:S.wa,ts:Date.now()}}
function applyData(d){d=d||{};S.quiz=d.quiz||null;S.done=d.done||{};S.start=d.start||"";S.w=d.w||[];S.gw=d.gw||0;S.wa=d.wa||{}}
function lk(e){return KEY+"::"+e.toLowerCase()}
function localData(e){try{return JSON.parse(localStorage.getItem(lk(e))||"null")}catch(x){return null}}
function setSync(t){SYNC=t;var el=document.getElementById("sync");if(el)el.textContent=t}
function save(){if(!S.email)return;try{localStorage.setItem(lk(S.email),JSON.stringify(payload()))}catch(e){}
if(!sb||!S.uid)return;setSync("Salvando na nuvem…");clearTimeout(stimer);stimer=setTimeout(push,700)}
function push(){if(!sb||!S.uid)return;sb.from("progress").upsert({user_id:S.uid,data:payload(),updated_at:new Date().toISOString()}).then(function(r){setSync(r.error?"Sem conexão: salvo só neste aparelho. Vamos tentar de novo.":"Progresso salvo na nuvem ✓");if(r.error)setTimeout(push,15000)},function(){setSync("Sem conexão: salvo só neste aparelho. Vamos tentar de novo.");setTimeout(push,15000)})}
async function loadCloud(){var r=await sb.from("progress").select("data").eq("user_id",S.uid).maybeSingle(),loc=localData(S.email);
if(r.error){applyData(loc);setSync("Sem conexão: usando os dados deste aparelho.");return}
var cl=r.data&&r.data.data;if(cl&&(!loc||(cl.ts||0)>=(loc.ts||0)))applyData(cl);else{applyData(loc);if(loc)push()}
setSync("Progresso salvo na nuvem ✓")}
async function enter(session){var a;try{a=await sb.rpc("has_access")}catch(e){a={error:e}}
if(a.error){LS.msg="Não foi possível verificar seu acesso. Confira a internet e tente de novo.";return render()}
if(!a.data){await sb.auth.signOut();S.uid="";S.email="";LS={step:"email",email:"",msg:"Seu acesso não está ativo para este e-mail. Use o e-mail da compra."};return render()}
S.email=(session.user.email||"").toLowerCase();S.uid=session.user.id;await loadCloud();S.view=S.quiz?"":"thanks";S.tab="cal";LS={step:"email",email:"",msg:""};render()}
function signOut(){var f=function(){S.email="";S.uid="";applyData(null);S.view="";S.tab="cal";LS={step:"email",email:"",msg:""};render()};if(sb)sb.auth.signOut().then(f,f);else f()}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}

function buildDay(d){
var q=S.quiz,al=q.a.slice(),wk=Math.min(4,Math.ceil(d/7)),pg=q.h.indexOf("gestante")>-1;
var low=pg||q.h.some(function(x){return["joelho","lombar","pressao","cardio"].indexOf(x)>-1});
var tp=d===30?"final":CYC[q.g][(d-1)%7];
if(pg&&["circuito","core","cardio","superiores","pernas"].indexOf(tp)>-1)tp=(d%2?"caminhada":"mobilidade");
var sets=Math.min(4,(q.l==="ativo"?3:2)+(wk>=3?1:0));
var mins=tp==="descanso"?20:parseInt(q.t,10)+(wk>=3&&q.l==="ativo"?5:0);
var notes=[];
if(pg)notes.push("Treino adaptado para gestantes e lactantes. Libere com seu médico e evite esforço intenso.");
if(q.h.indexOf("cardio")>-1)notes.push("Com problema cardíaco, só treine com liberação médica e pare se sentir dor no peito ou falta de ar.");
if(q.h.indexOf("pressao")>-1)notes.push("Pressão alta: reduza o sal, evite prender a respiração e faça os exercícios sem pressa.");
if(q.h.indexOf("diabetes")>-1)notes.push("Diabetes: evite açúcar e suco, mantenha horários regulares e siga a orientação do seu médico sobre treino e glicemia.");
if(q.h.indexOf("joelho")>-1)notes.push("Joelhos e articulações: sem impacto, faça os movimentos curtos e sem dor.");
if(q.h.indexOf("lombar")>-1)notes.push("Coluna: mantenha o abdômen firme e pare se sentir dor lombar.");
if(q.o)notes.push("Evite também: "+q.o+".");
return{d:d,tp:tp,rest:tp==="descanso",tema:TEMAS[d>28?4:wk-1],treino:treino(tp,q,low,sets),mins:mins,
cafe:pick(CAFE,d,al,0),almo:pick(ALMO,d,al,d%3),lanc:pick(LANC,d,al,1),jant:pick(JANT,d,al,2),
agua:q.h.indexOf("diabetes")>-1||q.h.indexOf("pressao")>-1?"Cerca de 2 L, ou o que seu médico indicar.":"2,5 L ao longo do dia.",
hab:HAB[(d-1)%HAB.length],notes:notes}}

function earned(){var r=[];for(var w=0;w<5;w++){var a=w*7+1,b=Math.min(30,a+6),ok=true;for(var k=a;k<=b;k++)if(!S.done[k])ok=false;if(ok)r.push(w)}return r}
function medStr(){var e=earned();return e.length?e.map(function(i){return MED[i][0]}).join(" "):"🌴"}
function tmDef(x){var m=x.mins*60;if(["cardio","caminhada","final"].indexOf(x.tp)>-1)return[m,0,1];if(x.tp==="core")return[30,20,8];if(x.tp==="circuito")return[40,20,10];if(x.tp==="mobilidade"||x.tp==="descanso")return[30,10,10];return[40,20,9]}
function timer(x){var c=tmDef(x),W=c[0],R=c[1],N=c[2],big=W>=300,ph="work",rd=1,t=W,run=false,iv=null,ac=null,o=document.createElement("div");
o.className="cel tm";document.body.appendChild(o);
function fmt(n){return Math.floor(n/60)+":"+("0"+n%60).slice(-2)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var g=ac.createGain(),s=ac.createOscillator();s.frequency.value=f;s.connect(g);g.connect(ac.destination);g.gain.value=.2;s.start();s.stop(ac.currentTime+d)}catch(e){}}
function close(){clearInterval(iv);o.remove()}
function end(){clearInterval(iv);run=false;ph="end";t=0;beep(988,.6);try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}confetti(40)}
function next(){if(ph==="work"){if(rd>=N)return end();if(R>0){ph="rest";t=R;beep(520,.3);return}rd++;t=W;beep(880,.3)}else{rd++;ph="work";t=W;beep(880,.3)}}
function upd(){var C=2*Math.PI*88,tot=ph==="work"?W:R;$("#rg").setAttribute("stroke-dashoffset",C*(1-(tot?t/tot:0)));$("#tt").textContent=fmt(t)}
function tick(){var a=ph,b=rd;t--;if(t>0&&t<=3)beep(700,.1);if(t<=0)next();if(a!==ph||b!==rd||ph==="end")draw();else upd()}
function draw(){var C=2*Math.PI*88,tot=ph==="work"?W:R,e=ph==="end",fresh=!run&&ph==="work"&&rd===1&&t===W;
var st=fresh?[["Esforço ("+(big?"min":"s")+")","w",big?W/60:W],["Pausa (s)","r",R],["Rodadas","n",N]].map(function(r){return '<div class="stp"><span>'+r[0]+'</span><span><button data-k="'+r[1]+'" data-d="-1" aria-label="Diminuir">−</button><b>'+r[2]+'</b><button data-k="'+r[1]+'" data-d="1" aria-label="Aumentar">+</button></span></div>'}).join(""):"";
o.innerHTML='<div class="celc tmc" role="dialog" aria-label="Cronômetro de treino"><p class="small">'+(e?"Treino concluído":"Rodada "+rd+" de "+N)+'</p><h2>'+(e?"Parabéns!":ph==="work"?"Esforço":"Pausa")+'</h2><div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--bd)" stroke-width="8"/><circle id="rg" cx="100" cy="100" r="88" fill="none" stroke="'+(ph==="rest"?"var(--mu)":"var(--sun)")+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(e?0:C*(1-(tot?t/tot:0)))+'" transform="rotate(-90 100 100)"/></svg><span id="tt">'+(e?"✓":fmt(t))+'</span></div>'+st+(e?'':'<button class="btn" id="tg">'+(run?"Pausar":fresh?"Iniciar":"Continuar")+'</button>')+'<button class="btn alt" id="rs">Reiniciar</button><button class="btn alt" id="tx">Fechar</button></div>';
$("#tx").onclick=close;
$("#rs").onclick=function(){clearInterval(iv);run=false;ph="work";rd=1;t=W;draw()};
if($("#tg"))$("#tg").onclick=function(){if(run){clearInterval(iv);run=false}else{run=true;beep(880,.2);iv=setInterval(tick,1000)}draw()};
Array.prototype.forEach.call(o.querySelectorAll("[data-k]"),function(b){b.onclick=function(){var k=b.dataset.k,d=+b.dataset.d;if(k==="w"){W=Math.max(big?60:5,W+d*(big?60:5));t=W}else if(k==="r")R=Math.max(0,R+d*5);else N=Math.max(1,N+d);draw()}})}
o.onclick=function(e){if(e.target===o)close()};draw()}
function wGoal(){var h=S.quiz?S.quiz.h:[];return h.indexOf("diabetes")>-1||h.indexOf("pressao")>-1?8:10}
function waterCard(){var g=wGoal(),n=Math.min(g,S.wa[today()]||0),h='<div class="card" id="wcard"><div class="top"><b>Água de hoje</b><span class="small">'+n+' de '+g+' copos ('+kg(n*.25)+' L)</span></div><div class="glasses">';
for(var i=0;i<g;i++)h+='<button class="gl" data-g="'+i+'" style="--f:'+(i<n?100:0)+'%" aria-label="Copo '+(i+1)+(i<n?', bebido':'')+'" aria-pressed="'+(i<n)+'"></button>';
return h+'</div><p class="small" style="margin-top:10px">'+(n>=g?'Meta de hoje batida! Parabéns.':'Cada copo tem 250 ml. Toque para registrar.')+'</p></div>'}
function bindWater(){Array.prototype.forEach.call(document.querySelectorAll(".gl"),function(b){b.onclick=function(){var i=+b.dataset.g,k=today(),n=Math.min(wGoal(),S.wa[k]||0);S.wa[k]=n===i+1?i:i+1;save();document.getElementById("wcard").outerHTML=waterCard();bindWater();if(S.wa[k]>=wGoal()&&n<wGoal())confetti(30)}})}
function hideEx(){var h=S.quiz?S.quiz.h:[],no=[];if(h.some(function(x){return["joelho","pressao","cardio","gestante"].indexOf(x)>-1}))no=no.concat(["afun","sumo","poli","mont"]);if(h.indexOf("lombar")>-1)no=no.concat(["elev","bici"]);return no}
function lockMsg(U){var i=(U/2)%4,a=U-1,b=U,n1=U+1,n2=U+2;
if(S.done[a]&&S.done[b]){var W=["BLOCO CONCLUÍDO! 🔥 Você arrasou! Os dias "+n1+" e "+n2+" abrem amanhã. Recarregue as energias!","Mais um bloco na conta! 💪 Amanhã tem os dias "+n1+" e "+n2+". Vem com tudo!","Que energia! ⚡ Você cumpriu o combinado hoje. Os dias "+n1+" e "+n2+" abrem amanhã. Prepare-se!","Você é imparável! 🚀 Os dias "+n1+" e "+n2+" te esperam amanhã. Bora!"];return W[i]}
var P=["Bora! 🔥 Conclua os dias "+a+" e "+b+" e abra o próximo bloco!","Vamos nessa! 💪 Faltam os dias "+a+" e "+b+" para liberar o próximo bloco. Você consegue!","Foco total! ⚡ Termine os dias "+a+" e "+b+" e desbloqueie o próximo bloco!","Hoje é dia de arrasar! 🚀 Complete os dias "+a+" e "+b+" e libere o próximo bloco!"];return P[i]}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
app.innerHTML='<section class="load"><div class="sunspin"></div><h1 class="long">Carregando…</h1></section>';
(async function(){if(!sb){render();return}try{var r=await sb.auth.getSession();if(r.data&&r.data.session)await enter(r.data.session);else render()}catch(e){render()}
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"&&S.uid){S.uid="";S.email="";render()}})})();
</script>
